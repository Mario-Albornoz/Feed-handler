kafka:
  brokers:
    - "localhost:9092"
  input_topic: "raw-ticks"
  output_topic: "normalized-vectors"
  alert_topic: "health-events"
  consumer_group: "aggregator-group"

windows:
  fast_window_ticks: 60
  slow_window_ticks: 700
  # Trade-to-trade price steps an instrument needs before its price statistics are warm.
  # Trades are rare (the median instrument has about 10 a day), so this is lower than the
  # 50 messages the timing statistics need.
  min_price_observations: 20
  # A z-score is taken against statistics that do not yet include the observation, so
  # nothing caps it: after a run of identical values (half of all trade-to-trade price
  # steps are 0) the variance is near 0 and the next ordinary value scores in the
  # millions. No standard deviation is used below resolution/sqrt(12), the rounding
  # noise of the measurement.
  timing_resolution_ms: 1000     # the feature clock is the whole-second update time
  price_resolution_bps: 1.0      # price grid, in bp of the price (median non-zero step ~1.5 bp)
  # Winsorized statistics: once warm, an observation updates the mean and variance clipped
  # to mean +- winsor_z standard deviations, so one outlier cannot inflate the variance and
  # hide the next anomaly on the same instrument (masking). The z-scores and CUSUMs still
  # see the full value. 10 removed the masking on 08 Nov with the least change to normal
  # traffic (3 and 5 also clip the heavy but normal tail). A negative value disables it.
  winsor_z: 10.0

cusum:
  slack: 0.5
  threshold: 5.0
  # Largest z-score one observation adds to a CUSUM. Without it one extreme value raised
  # the CUSUM by up to 1e6, which the slack (0.5 a step) never works off.
  z_clip: 10.0
  # Reset each instrument's CUSUMs on its first message of a new day, so evidence from one
  # session (e.g. an injection day) does not carry into the next.
  reset_daily: true

# Silence: an instrument is silent when it has been quiet for longer than a high quantile
# of its OWN past gaps between messages. (A multiple of the mean gap was tried and fires
# on ordinary gaps: 34-47 alerts per 1000 messages on a clean feed against about 1 for the
# 99.9th percentile.) Timing runs on the whole-second update time.
silence:
  check_interval_sec: 5          # wall-clock cadence of the periodic scan
  gap_quantile: 0.999            # quantile of the instrument's own gaps
  gap_quantile_multiplier: 1.0   # alerts are logged at this value; stricter ones can be applied later
  min_observations: 50           # gaps an instrument needs before it can alert
  min_threshold_ms: 1000         # clock resolution (whole seconds); not a tuned value

# Feed-integrity validator: rejects ticks with a malformed ISIN or a timestamp that
# jumps backwards, before they reach the feature pipeline.
validation:
  enabled: true
  # Update times step backwards by up to 1s in normal operation (trade times carry
  # whole seconds, quote updates milliseconds), so anything below that is noise.
  timestamp_tolerance_ms: 1000

# Where alerts go. The CSV logs are what the thesis evaluation reads; they are
# recreated on every start, so copy them out of the way before a new run.
alerts:
  silence_log: "data/eval/silence_alerts.csv"
  validation_log: "data/eval/validation_alerts.csv"
  kafka_silence_alerts: false   # true also publishes silence alerts to kafka.alert_topic

stats:
  report_interval_sec: 5  # Report throughput statistics every 5 seconds

profiles:
  equity:
    model_key: "equity"
  options:
    model_key: "options"
  crypto:
    model_key: "equity"

# Session hours for every exchange in the data (Euronext Paris/Amsterdam, Xetra).
#
# The DEBS timestamps are exchange-local wall-clock time (CET) with no zone, and the
# parser labels them UTC. Sessions are therefore written on that same clock and the
# zone is UTC: naming Europe/Paris here would shift every session by an hour. (Evidence:
# activity runs 09:00-17:30 on this clock and halves in the 17:00 hour, i.e. the
# 17:30 close; nothing happens before 08:00.)
#
# Buckets follow the intraday pattern of the data: busy open, a lull around 13:00, and
# a busier close once US markets open at 15:30. Note the simulator replays a copy of the
# days that stops at 16:00, so in that replay "Close" only covers 15:30-16:00.
default_exchange:
  timezone: "UTC"
  premarket_start: "07:00"
  market_open: "09:00"
  midday_start: "11:00"
  close_start: "15:30"
  market_close: "17:30"
  afterhours_end: "20:00"
  trading_weekdays: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
