kafka:
  brokers:
    - "localhost:9092"
  input_topic: "raw-ticks"
  output_topic: "normalized-vectors"
  alert_topic: "health-events"
  consumer_group: "aggregator-group"

windows:
  fast_window_ticks: 60
  slow_window_ticks: 14400

cusum:
  slack: 0.5
  threshold: 5.0

silence:
  check_interval_sec: 5
  gap_multiplier: 5.0

stats:
  report_interval_sec: 5  # Report throughput statistics every 5 seconds

profiles:
  equity:
    model_key: "equity"
  options:
    model_key: "options"
  crypto:
    model_key: "equity"

default_exchange:
  timezone: "America/New_York"
  premarket_start: "04:00"
  market_open: "09:30"
  midday_start: "12:00"
  close_start: "15:30"
  market_close: "16:00"
  afterhours_end: "20:00"
  trading_weekdays: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
